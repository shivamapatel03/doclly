<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Doclly - PDF & Document Tools</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    
    <!-- Top Header -->
    <header class="header">
      <div class="header-left">
        <img src="icons/logo.png" alt="Doclly" class="brand-logo" id="logoLink">
      </div>
      <a href="https://student.doclly.online" target="_blank" class="badge-student" id="studentOfferBadge">
        🎓 ₹19 Student Pass
      </a>
    </header>

    <!-- Search Bar -->
    <div class="search-box">
      <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="8"></circle>
        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
      </svg>
      <input type="text" id="searchInput" placeholder="Search 25+ PDF tools (e.g. compress, edit, word)..." autocomplete="off" autofocus>
      <span class="search-clear" id="searchClear" style="display: none;">&times;</span>
    </div>

    <!-- Category Filter Tabs -->
    <div class="category-tabs">
      <button class="tab-btn active" data-category="all">All</button>
      <button class="tab-btn" data-category="edit">Edit & Sign</button>
      <button class="tab-btn" data-category="convert">Convert</button>
      <button class="tab-btn" data-category="optimize">Compress</button>
      <button class="tab-btn" data-category="organize">Organize</button>
    </div>

    <!-- Quick Dropzone -->
    <div class="dropzone" id="dropzone">
      <div class="dropzone-inner">
        <img src="icons/3d/upload.png" alt="Upload" class="dropzone-icon">
        <div class="dropzone-text">
          <strong>Drop any PDF here</strong> or click to browse
        </div>
      </div>
      <input type="file" id="fileInput" accept=".pdf,.doc,.docx,.xls,.xlsx,.ppt,.pptx,.jpg,.png" style="display: none;">
    </div>

    <!-- Tools Grid Container -->
    <div class="tools-scroll-area">
      <div class="tools-grid" id="toolsGrid">
        <!-- Tools will be rendered dynamically by popup.js -->
      </div>
      
      <!-- No Results State -->
      <div class="no-results" id="noResults" style="display: none;">
        <p>No tools matching "<span id="noResultsQuery"></span>"</p>
        <a href="https://www.doclly.online" target="_blank" class="btn-home">Browse All Tools on Doclly &rarr;</a>
      </div>
    </div>

    <!-- Bottom Footer -->
    <footer class="footer">
      <div class="footer-privacy">
        <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="#10B981" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
        </svg>
        <span>100% Client-Side Privacy</span>
      </div>
      <a href="https://www.doclly.online" target="_blank" class="footer-link">
        doclly.online &rarr;
      </a>
    </footer>

  </div>

  <script src="popup.js"></script>
</body>
</html>
