      <rect x="5" y="5" width="26" height="26" rx="6" fill="url(#prt3d_base)" />
      <rect x="5.5" y="5.5" width="25" height="25" rx="5.5" stroke="white" stroke-opacity="0.35" stroke-width="1" />
      
